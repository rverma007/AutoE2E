[pytest]
# ---------------------------------------------------------------------------
# AutoPythone2e pytest configuration
# ---------------------------------------------------------------------------
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default CLI args — a rich HTML report is always produced under reports/
# Allure raw results also land in reports/allure-results (serve with
# `allure serve reports/allure-results`).
addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --html=reports/sanity_report.html
    --self-contained-html
    --capture=tee-sys
    --alluredir=reports/allure-results
    --clean-alluredir
    -n 4
    --dist loadfile

markers =
    sanity: quick smoke / sanity checks that must pass after every deploy
    regression: full regression suite
    slow: long-running tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
