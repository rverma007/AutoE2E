[pytest]
# ---------------------------------------------------------------------------
# AutoPythone2e pytest configuration
# ---------------------------------------------------------------------------
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default CLI args — a rich HTML report is always produced under reports/
# Allure raw results also land in reports/allure-results (serve with
# `allure serve reports/allure-results`).
addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --html=reports/sanity_report.html
    --self-contained-html
    --capture=tee-sys
    --alluredir=reports/allure-results
    --clean-alluredir
    --reruns=1
    --reruns-delay=2

markers =
    sanity: quick smoke / sanity checks that must pass after every deploy
    regression: full regression suite
    slow: long-running tests
    agentic: AI-assisted tests using Claude vision, self-healing selectors, and autonomous agents
    dependency: mark test dependencies (ingestion must pass before download)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
